<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Navy Blue Form</title>
	<style>
		:root {
			--bg-start: #083344;
			--bg-end: #0e7490;
			--card: #155e75;
			--text: #ecfeff;
			--muted: #a5f3fc;
			--accent: #67e8f9;
			--accent-hover: #a5f3fc;
			--input-bg: #0b5f78;
			--input-border: #22d3ee;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			color: var(--text);
			background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
			padding: 20px;
		}

		.form-card {
			width: 100%;
			max-width: 420px;
			background: var(--card);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 14px;
			padding: 24px;
			box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
		}

		h1 {
			margin: 0 0 6px;
			font-size: 1.5rem;
		}

		.subtitle {
			margin: 0 0 20px;
			color: var(--muted);
			font-size: 0.95rem;
		}

		.field {
			margin-bottom: 14px;
		}

		label {
			display: block;
			margin-bottom: 6px;
			font-size: 0.95rem;
		}

		input {
			width: 100%;
			padding: 10px 12px;
			border-radius: 8px;
			border: 1px solid var(--input-border);
			background: var(--input-bg);
			color: var(--text);
			outline: none;
		}

		input::placeholder {
			color: #bae6fd;
		}

		input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.24);
		}

		.actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			margin-top: 10px;
		}

		button,
		.link-btn {
			border: none;
			border-radius: 8px;
			padding: 10px 14px;
			font-weight: bold;
			cursor: pointer;
		}

		button {
			background: var(--accent);
			color: #083344;
		}

		button:hover {
			background: var(--accent-hover);
		}

		.link-btn {
			text-decoration: none;
			background: transparent;
			border: 1px solid var(--accent);
			color: var(--text);
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		.link-btn:hover {
			background: rgba(103, 232, 249, 0.18);
		}
	</style>
</head>
<body>
	<form class="form-card" id="loginForm" action="#" method="post">
		<h1>Login Form</h1>
		<p class="subtitle">#0e7490 themed Gmail and Password form</p>

		<div class="field">
			<label for="gmail">Gmail</label>
			<input id="gmail" name="gmail" type="email" placeholder="Enter your Gmail" required>
		</div>

		<div class="field">
			<label for="password">Password</label>
			<input id="password" name="password" type="password" placeholder="Enter your password" required>
		</div>

		<div class="actions">
			<button type="button" onclick="if(this.form.reportValidity()){window.location.href='cricket.html';}">submit</button>
		</div>
	</form>
</body>
</html>
